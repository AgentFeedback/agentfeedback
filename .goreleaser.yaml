# GoReleaser configuration for the release step. Run it through `just release`
# (scripts/release.sh), which pins the GoReleaser version and the Go toolchain;
# docs/releases.md describes the flow and the asset names.
version: 2

project_name: agentfeedback

dist: dist/release

builds:
  - id: agentfeedback
    main: ./cmd/agentfeedback
    binary: agentfeedback
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # Reproducible: no build date. docs/operate.md#build-from-source repeats
    # this exact line; keep the two identical.
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: agentfeedback
    ids: [agentfeedback]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Archives are reproducible too: fixed owner, mode and the commit date.
    builds_info:
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

# SHA256SUMS covers the six archives and install.sh, so a downloader can check
# the installer against the release before running it (AGENT-INSTALL.md step
# 2.1). Integrity only: the release is not signed.
checksum:
  name_template: SHA256SUMS
  algorithm: sha256
  ids: [agentfeedback]
  extra_files:
    - glob: ./skills/agentfeedback/scripts/install.sh

# The container image: the linux binaries above copied into the runtime stage
# of the repository's Dockerfile (BINARY_FROM=prebuilt). dockers_v2 builds and
# pushes in the publish phase only, before the GitHub release is created; a
# snapshot builds one local image per platform, its tags suffixed -amd64 and
# -arm64. Tags: the version without the v, the full commit SHA, and latest for
# a stable release.
dockers_v2:
  - id: agentfeedback
    ids: [agentfeedback]
    dockerfile: Dockerfile
    images:
      - ghcr.io/agentfeedback/agentfeedback
    tags:
      - "{{ .Version }}"
      - "{{ .FullCommit }}"
      - "{{ if and (not .Prerelease) (not .IsSnapshot) }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      BINARY_FROM: prebuilt
    # Image attestations (SBOM, signature) are a follow-up; buildx adds its
    # default provenance only.
    sbom: false
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.source: https://github.com/AgentFeedback/agentfeedback
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: MIT
    annotations:
      "index,manifest:org.opencontainers.image.source": https://github.com/AgentFeedback/agentfeedback
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index,manifest:org.opencontainers.image.licenses": MIT

changelog:
  disable: true

snapshot:
  version_template: "{{ .Version }}-snapshot"

release:
  github:
    owner: AgentFeedback
    name: agentfeedback
  name_template: "{{ .Tag }}: {{ .Env.RELEASE_TITLE }}"
  prerelease: auto
  make_latest: "{{ not .Prerelease }}"
  mode: keep-existing
  # A rerun after a failed upload finds the draft by its name (same title) and
  # replaces assets with their byte-identical rebuilds (docs/releases.md,
  # Recovery). GoReleaser keeps every release a draft until all assets are up.
  use_existing_draft: true
  replace_existing_artifacts: true
  extra_files:
    - glob: ./skills/agentfeedback/scripts/install.sh
