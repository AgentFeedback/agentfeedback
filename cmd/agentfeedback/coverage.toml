# Contract coverage of the CLI: every operation of docs/openapi.yaml, every
# parameter it takes (query, path, header, cookie; path-item parameters
# included) and every property of its request-body schema (every content
# type; a body without properties, such as NDJSON, has none) is listed here.
# coverage_test.go fails on anything missing, anything stale, and any command,
# flag or argument the CLI lacks.
#
# Format:
#   [operations.<operationId>]              exactly one of
#     command = "<cli command name>"        the command that calls it, or that
#                                           serves the same content locally
#     reason = "<why the CLI has no command>"
#     also = ["<cli command name>", ...]    optional: other commands that send
#                                           through it without their own flags
#   [operations.<operationId>.parameters]   every parameter (query, path, header, cookie)
#   [operations.<operationId>.body]         every request-body property
#     <name> = { flag = "--name" }          set by this flag
#     <name> = { arg = "<name>" }           set by this positional argument
#     <name> = { reason = "..." }           not set by the command, and why
# Operations listed with a reason still list their parameters and body.
# Another client surface reuses the format with tool and argument in place of
# command and flag.

# ui reads list, get, stats and meta with the filters of its form, not flags.
# ingest submits the inbox files as written, through the same operation.
[operations.createSubmission]
command = "submit"
also = ["ingest"]

[operations.createSubmission.body]
kind = { arg = "<kind>" }
schema_version = { flag = "--schema-version" }
key = { flag = "--key" }
summary = { flag = "--summary" }
machine = { flag = "--machine" }
model = { flag = "--model" }
harness = { flag = "--harness" }
project = { flag = "--project" }
occurred_at = { reason = "set to the current time; --stdin carries an explicit value" }
context = { reason = "collected on the client; --stdin carries an explicit object" }
payload = { reason = "friction members from --category, --details, --suggested-fix, --fix-status, --fix-ref and --severity; any kind through --stdin; --scrub (and context.origin session-scan) replaces known secret formats in every string value of the body" }

