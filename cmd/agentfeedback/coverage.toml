[operations.markSubmission]
reason = "done and undo use the bulk route; a single id is a one-element list"

[operations.markSubmission.parameters]
id = { reason = "done and undo send ids in the bulk body" }

[operations.markSubmission.body]
processed = { reason = "done and undo use the bulk route" }
verdict = { reason = "done and undo use the bulk route" }
resolution = { reason = "done and undo use the bulk route" }
ref = { reason = "done and undo use the bulk route" }
processed_by = { reason = "done and undo use the bulk route" }

[operations.redactSubmission]
command = "redact"

[operations.redactSubmission.parameters]
id = { arg = "<id>" }

[operations.markSubmissions]
command = "done"

[operations.markSubmissions.body]
ids = { arg = "<id>" }
processed = { reason = "done sends true, undo sends false" }
verdict = { flag = "--verdict" }
resolution = { flag = "--resolution" }
ref = { flag = "--ref" }
processed_by = { flag = "--processed-by" }

