harness = { flag = "--harness" }
category = { flag = "--category" }
origin = { flag = "--origin" }
fix_status = { flag = "--fix-status" }
exclude_kind = { flag = "--exclude-kind" }
verdict = { flag = "--verdict" }
processed = { flag = "--processed" }
redacted = { flag = "--redacted" }
content_hash = { flag = "--content-hash" }
since = { flag = "--since" }
until = { flag = "--until" }
on = { flag = "--on" }
q = { flag = "--q" }
before_id = { flag = "--before-id" }
after_id = { flag = "--after-id" }
limit = { flag = "--limit" }
include = { flag = "--include" }

[operations.getSubmission]
command = "get"
also = ["ui"]

[operations.getSubmission.parameters]
