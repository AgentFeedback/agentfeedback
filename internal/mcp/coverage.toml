# Contract coverage of the MCP tools: every operation of docs/openapi.yaml,
# every parameter it takes (query, path, header, cookie; path-item parameters
# included) and every property of its request-body schema is listed here.
# coverage_test.go fails on anything missing, anything stale, any tool the
# server does not register and any argument a tool's input schema lacks.
#
# Format (cmd/agentfeedback/coverage.toml's, with tool and argument in place
# of command and flag):
#   [operations.<operationId>]              exactly one of
#     tool = "<tool name>"                  the tool that calls it
#     reason = "<why no tool does>"
#   [operations.<operationId>.parameters]   every parameter (query, path, header, cookie)
#   [operations.<operationId>.body]         every request-body property
#     <name> = { argument = "<name>" }      set by this tool argument
#     <name> = { reason = "..." }           not set by the tool, and why
# Operations listed with a reason still list their parameters and body.

[operations.createSubmission]
tool = "submit_feedback"

# On /mcp/{project} the path sets project and the tool has no project argument.
[operations.createSubmission.body]
kind = { argument = "kind" }
schema_version = { argument = "schema_version" }
key = { argument = "key" }
summary = { argument = "summary" }
machine = { argument = "machine" }
model = { argument = "model" }
harness = { argument = "harness" }
project = { argument = "project" }
occurred_at = { argument = "occurred_at" }
context = { argument = "context" }
payload = { argument = "payload" }

