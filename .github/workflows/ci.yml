name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: taiki-e/install-action@v2.87.7
        with:
          tool: just
      - name: just check and tree cleanliness
        run: |
          just check
          git diff --exit-code
      - name: race tests
        run: go test -race -count=1 ./...
      - name: live HTTP end-to-end API contract
        env:
          E2E_API_KEY: ci-e2e-api-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          feedback_pid=
          cleanup() {
            if [ -n "$feedback_pid" ]; then
              kill -TERM "$feedback_pid" 2>/dev/null || true
              wait "$feedback_pid" || true
            fi
            rm -rf "$workdir"
          }
          trap cleanup EXIT
          API_KEY="$E2E_API_KEY" DATABASE_PATH="$workdir/agentfeedback.db" \
            HTTP_LISTEN_ADDR=127.0.0.1:18080 ./bin/agentfeedback &
          feedback_pid=$!
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:18080/ready >/dev/null
          bash scripts/e2e.sh "$E2E_API_KEY" http://127.0.0.1:18080

  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: shellcheck client scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          cd skills/agentfeedback/scripts && shellcheck -x ./*.sh
      - name: shellcheck triage scripts
        run: |
          if ls skills/agentfeedback-triage/scripts/*.sh >/dev/null 2>&1; then
            cd skills/agentfeedback-triage/scripts && shellcheck -x ./*.sh
          else
            echo "no agentfeedback-triage scripts yet, skipping"
          fi
      - name: hermetic client tests (mock server with isolated HOME)
        run: bash tests/skill/run-tests.sh

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - name: schemas, examples, conformance fixtures against the reference
        run: uv run --locked --script scripts/contract-check.py
      - name: OpenAPI lint
        run: npx --yes @redocly/cli@2.54.2 lint docs/openapi.yaml

  image:
    needs: [test, skill, contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: image name (registry references must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4.3.0
      - uses: docker/setup-buildx-action@v4.3.0
      - name: build and push multi-architecture image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
