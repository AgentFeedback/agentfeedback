name: Publish packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download and verify release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir archives --pattern 'agentfeedback_*' --pattern SHA256SUMS
          python3 scripts/package-release.py npm --tag "$RELEASE_TAG" --archives archives --output packages
      - name: Publish platform packages before launcher
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/publish-npm.py --tag "$RELEASE_TAG" --packages packages

  npm-smoke:
    needs: npm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run published CLI
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${RELEASE_TAG#v}
          output=$(npx --yes "@agentfeedback/cli@$version" version)
          printf '%s\n' "$output"
          [[ "$output" == "agentfeedback $version "* ]]

  pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build wheels from verified release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir archives --pattern 'agentfeedback_*' --pattern SHA256SUMS
          python3 scripts/package-release.py pypi --tag "$RELEASE_TAG" --archives archives --output dist
      - name: Publish wheels with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true

  pypi-smoke:
    needs: pypi
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Run published CLI through pipx
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install pipx
          version=${RELEASE_TAG#v}
          version=${version/-rc./rc}
          output=$(python -m pipx run --spec "agentfeedback-cli==$version" agentfeedback version)
          printf '%s\n' "$output"
          [[ "$output" == "agentfeedback ${RELEASE_TAG#v} "* ]]
